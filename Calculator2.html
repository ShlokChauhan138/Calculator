<!DOCTYPE html>
<html>
    <head>
        <title>Document</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            form{
                margin-left: 20px;
                background-color: lightpink;
                width: 50%;
            }
            .result-box{
                margin-left:25px;
                background-color: aqua;
                padding: 10px;
                width: 20%;
            }
        </style>
    </head>
    <body>
        <div class="jumbotron">
            <h1 class="mb-3">Calculator</h1>
            <p>Calculate ANYTHING!</p>
        </div>
        
        <form class="p-3">
            <label for="num1">Number 1:</label> <input type="number" id="num1" name="num1"> 
            <label for="num2">Number 2:</label> <input type="number" id="num2" name="num2">
            <br>
            <button type="button" onclick="add()" class="btn btn-primary">Add</button>
            <button type="button" onclick="sub()" class="btn btn-warning">Subtract</button>
            <button type="button" onclick="mul()" class="btn btn-danger">Multiply</button>
            <button type="button" onclick="div()" class="btn btn-info">Divide</button>
        </form>
        <br>
        <div class="result-box">Answer: <span id="result"></span></div>

        <script type="text/javascript">
            var display = document.getElementById("result");

            function add(){
                var a = Number(document.getElementById("num1").value);
                var b = Number(document.getElementById("num2").value);
                display.innerHTML = a+b;
            }
            function sub(){
                var a = Number(document.getElementById("num1").value);
                var b = Number(document.getElementById("num2").value);
                display.innerHTML = a-b;
            }
            function mul(){
                var a = Number(document.getElementById("num1").value);
                var b = Number(document.getElementById("num2").value);
                display.innerHTML = a*b;
            }
            function div(){
                var a = Number(document.getElementById("num1").value);
                var b = Number(document.getElementById("num2").value);

                if(b == 0){
                    display.innerHTML = "Unable to divide by 0 !";
                }else{
                    display.innerHTML = a/b;
                }
            }
        </script>
    </body>
</html>
